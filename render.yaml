services:
  - type: web
    name: smart-hrms
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://smart-hrms.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string here in the Render dashboard
